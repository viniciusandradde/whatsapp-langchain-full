[project]
name = "whatsapp-langchain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.2.15",
    "langgraph==1.1.10",
    "langchain-openai==1.1.7",
    "langgraph-checkpoint-postgres==3.0.4",
    "python-dotenv==1.2.1",
    "fastapi==0.129.0",
    "uvicorn[standard]==0.46.0",
    "psycopg[binary,pool]==3.3.2",
    "pydantic-settings==2.12.0",
    "structlog==25.5.0",
    "httpx==0.28.1",
    "python-multipart==0.0.22",
    "twilio==9.10.2",
    "google-api-python-client==2.184.0",
    "google-auth==2.42.0",
    "google-auth-oauthlib==1.3.0",
    # M5.c.2 — extração de texto pra upload de PDF/DOCX
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    # Histórico — export XLSX do módulo de histórico de atendimentos
    "openpyxl==3.1.5",
    # M5.c.3 — OCR de PDFs escaneados + imagens (PNG/JPG)
    "pdf2image==1.17.0",
    "Pillow==11.0.0",
    # Fase 0 enterprise — observabilidade.
    # OTel sem version pin pra evitar conflito protobuf (resolver acha mais
    # nova compatível com langgraph/grpc deps); pinned no uv.lock após resolve.
    "prometheus-client>=0.21,<1.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    # Sprint Wareline — cripto Fernet pra credenciais de integrações externas
    "cryptography>=42,<46",
    # Langfuse — observabilidade LLM self-hosted (prompt mgmt + traces + scores).
    # Opcional em runtime: settings.langfuse_enabled = (public_key + secret_key
    # ambas setadas). Sem keys, todo código é no-op.
    "langfuse>=3.0,<4.0",
    # openevals — LLM-as-judge do `POST /api/admin/rag/eval/run`. Estava só em
    # `dev`, e como o Dockerfile exporta com `--no-dev` ele nunca entrou na
    # imagem: o `except ImportError` do eval engolia a ausência e devolvia
    # `score: None` em todo exemplo, sem erro nenhum na tela. É dependência de
    # runtime porque um endpoint da API depende dela.
    "openevals>=0.2,<0.3",
    # Relatório mensal de uso (mig 165) — o PDF que o cliente recebe pelo
    # WhatsApp é desenhado com fpdf2. Estava só em `dev`, pelo mesmo motivo
    # histórico do openevals acima: era usado por um script, não pela API. Com
    # a rota `/api/relatorios/uso/{id}/pdf` e o envio agendado no worker, virou
    # dependência de runtime das duas imagens.
    "fpdf2>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]==0.4.24",
    "langgraph-api==0.8.3",
    "langgraph-sdk==0.3.13",
    "ruff==0.9.6",
    "pyright==1.1.408",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    # Sprint K — bateria E2E profissional + relatórios
    "deepeval>=3.9,<4.0",
    "allure-pytest>=2.16,<3.0",
    # Sprint R — streaming JSON parser pra dump de 178MB+
    "ijson>=3.3,<4.0",
    "PyYAML>=6.0,<7.0",
    # Sprint Wareline — mock httpx pra E2E sem rede
    "respx>=0.21,<0.23",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Sub-projetos / didáticos / scratch não fazem parte do source lintado.
extend-exclude = ["docs", "webscap", "patch"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 (linha > 88): o formatter já cuida do comprimento de código; sobra só em
# comentários/docstrings/strings que ele não quebra — ruído, não bug.
# E402 (import fora do topo): há imports tardios intencionais (lazy/condicional).
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# Os scripts de operação rodam no HOST de produção, fora dos containers, e o
# cabeçalho do `analise_producao.py` promete sobreviver a um host sem o 3.11
# (o Oracle Linux 8 traz 3.6, e o dnf depende dele). UP* pede sintaxe mais nova
# — f-string, `capture_output`, `class X:` sem `object` — que quebraria essa
# promessa. Lint não vale quebrar compatibilidade declarada.
"scripts/analise_producao.py" = ["UP"]
"scripts/producao_checks.py" = ["UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
# Sem isto o pytest varre o repositório inteiro e coleta
# `src/whatsapp_langchain/integrations/test_handlers.py`, que não é teste: são
# os handlers do POST /api/integracoes/{id}/testar, importados por
# `integracoes_api.py`. Suas funções se chamam `test_asaas` e `test_custom`, e
# o pytest tentava executá-las — daí dois ERROR fixos em toda rodada, por
# fixture inexistente. Hoje o estrago é só ruído, mas um handler novo que não
# receba argumento seria de fato EXECUTADO pela suíte, disparando chamada HTTP
# com credencial real. Os alvos que passam caminho explícito (test-flows,
# test-e2e) não são afetados.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker_demo: testes demonstrativos que exigem API/Worker/DB rodando em Docker",
    "twilio_real: smoke tests que enviam mensagens reais via Twilio (requer TWILIO_LIVE_TESTS=1)",
]

[tool.coverage.run]
source = ["src/whatsapp_langchain"]
omit = [
    # Entry points cobertos por integration, não por unit
    "src/whatsapp_langchain/server/main.py",
    "src/whatsapp_langchain/worker/main.py",
    # Pool/migrations testados via integration
    "src/whatsapp_langchain/shared/db.py",
]

[tool.coverage.report]
# Política mínima Fase 0 — gate em 50%; sobe pra 60% até Fase 4 (vide
# memory feedback_testing_policy.md).
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
]
show_missing = true
skip_covered = false
