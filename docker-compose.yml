# Docker Compose para desenvolvimento local.
# Sobe PostgreSQL (com pgvector), API e Worker.
#
# Uso:
#   docker compose up -d         # Sobe tudo
#   docker compose up -d db      # Só o banco
#   docker compose logs -f       # Logs
#   docker compose down          # Para tudo
#
# Profiles:
#   docker compose --profile testing up stress   # Sobe o Locust para teste de carga

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: whatsapp_langchain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # Object storage S3-compatível (mig 183). Interno à rede do compose (sem
  # portas publicadas). Credenciais via env com default de dev — em produção
  # o Dokploy sobrescreve MINIO_ROOT_USER/PASSWORD (ou aponta S3_ENDPOINT_URL
  # pra um bucket na nuvem e remove este serviço).
  minio:
    # quay.io, não Docker Hub: a MinIO migrou as imagens; o `minio/minio` do
    # Docker Hub dá "repository does not exist" (inclusive em produção). Pinado
    # por digest (equivale ao :latest verificado em 2026-09-15).
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/whatsapp_langchain
      LOG_JSON: "true"
      INTERNAL_SERVICE_TOKEN: dev-token-change-in-production
      # Object storage (mig 183) — aponta pro MinIO interno por default.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-chatnexus-midia}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/whatsapp_langchain
      LOG_JSON: "true"
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-chatnexus-midia}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      # API interna via rede do compose (não localhost)
      INTERNAL_API_URL: http://api:8000
      INTERNAL_SERVICE_TOKEN: dev-token-change-in-production
      # Better Auth
      DATABASE_URL: postgresql://postgres:postgres@db:5432/whatsapp_langchain
      BETTER_AUTH_SECRET: dev-secret-change-in-production-min-32-chars!!
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy

  # Test Runner E2E (Sprint L) — container dedicado com pytest + Java + allure.
  # NÃO sobe junto com o stack principal (mantém imagem do chat leve).
  # Sobe com: docker compose --profile tests up -d tests
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/whatsapp_langchain
      LOG_JSON: "true"
      WEBHOOK_BASE_URL: http://api:8000
      TEST_RUNNER_REPO_ROOT: /app
    expose:
      - "8001"
    volumes:
      - tests_reports:/app/tests/reports
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tests

  # Locust para teste de carga.
  # Usa profile "testing" para não subir junto com os serviços principais.
  # Só inicia com: docker compose --profile testing up stress
  stress:
    build:
      context: ./stress
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    environment:
      LOCUST_HOST: http://api:8000
    depends_on:
      api:
        condition: service_started
    profiles:
      - testing

volumes:
  postgres_data:
  tests_reports:
  minio_data:
