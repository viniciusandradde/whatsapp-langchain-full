<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="nexus-ui.css" />
    <style>
      body { margin: 0; min-height: 100vh; }
      .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
      .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
      .actions { display: flex; gap: 8px; margin-top: 16px; }
      .actions .nx-btn { width: auto; }
    </style>
  </head>
  <body class="nx-root">
    <div class="wrap">
      <h1><span class="nx-logo">N</span> Nexus Disparador</h1>
      <div class="sub">Conecte a extensão à sua conta do Nexus.</div>

      <label class="nx-label">Servidor</label>
      <input class="nx-input" id="backendUrl" placeholder="https://api.vsanexus.com" />
      <div class="nx-hint">Endereço do seu Nexus, sem barra no final.</div>

      <label class="nx-label">API key da empresa</label>
      <input class="nx-input" id="apiKey" type="password" placeholder="nxs_…" />
      <div class="nx-hint">
        Gere no painel em Disparador → API keys (com os escopos capture,
        dispatch e templates). Ela aparece só uma vez.
      </div>

      <div class="actions">
        <button class="nx-btn" id="save">Salvar</button>
        <button class="nx-btn nx-btn-outline" id="test">Testar conexão</button>
      </div>
      <div class="nx-log" id="msg"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
