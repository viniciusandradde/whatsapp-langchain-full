# Compose dedicado pro Dokploy.
# Diferenças do docker-compose.yml local:
# - sem `ports:` (Traefik roteia)
# - DATABASE_URL e BETTER_AUTH_URL vêm das envs do painel
# - POSTGRES_PASSWORD obrigatório (sem default)
# - `name: chat-nexus` pra containers virem com prefixo chat-nexus-* em vez
#   do auto-gerado pelo Dokploy (projetos-chatvsanexus-er02mp-*).
#
# CI/CD (2026-07-23): SEM `build:` — as imagens vêm prontas do registry
# privado (registry.vsanexus.com), buildadas pelo GitHub Actions
# (.github/workflows/deploy.yml). O deploy do Dokploy só faz pull +
# recreate (~segundos), nada compila na máquina de produção (o build
# derrubava o nó Swarm — ver docs/DEPLOY.md e gotcha_deploy_sob_carga).
# IMAGE_TAG vem do env do Dokploy (default latest); o CI atualiza pra
# fixar o SHA de cada release quando configurado.
# pull_policy: always é OBRIGATÓRIO com tag :latest — sem ele o compose
# up reutiliza a imagem local antiga e o deploy "passa" sem atualizar
# nada (aconteceu no primeiro deploy da esteira, 2026-07-23).

name: chat-nexus

services:
  db:
    image: registry.vsanexus.com/chatnexus/db:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      POSTGRES_DB: whatsapp_langchain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # Object storage S3-compatível (mig 183/184). Interno (sem portas publicadas),
  # só a rede do compose alcança. Imagem no NOSSO registry: o quay.io passou a
  # exigir login para `minio/minio` (401 em 24/09/2026, o deploy parou antes de
  # recriar api/worker) e o `minio/minio` do Docker Hub dá "repository does not
  # exist". É a MESMA imagem que rodava (sha256:14cea493…, RELEASE.2025-09-07),
  # re-tagueada e enviada ao registry.vsanexus.com. `pull_policy: missing`: o
  # MinIO não muda a cada deploy — baixar sempre só amarra o deploy do app a um
  # registry de terceiro.
  #
  # LIGAR O STORAGE = setar no Dokploy: S3_ACCESS_KEY, S3_SECRET_KEY e S3_BUCKET.
  # As duas primeiras viram TAMBÉM as credenciais root do MinIO (fonte única).
  # Sem S3_BUCKET, o app não usa storage (fluxo base64 antigo) — o MinIO até
  # sobe, mas fica ocioso. Sem `depends_on` no api/worker de propósito: MinIO
  # com problema não pode derrubar o app (o webhook cai pro base64).
  #
  # ATENÇÃO backup: `minio_data` vive neste VPS — mesmo risco de desastre do
  # banco. Entra no docs/MIGRACAO_SERVIDOR.md / rotina de backup.
  minio:
    image: registry.vsanexus.com/chatnexus/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: missing
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-chatnexus}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-troque-por-uma-senha-forte-no-dokploy}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    image: registry.vsanexus.com/chatnexus/api:${IMAGE_TAG:-latest}
    pull_policy: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/whatsapp_langchain
      # RLS enforcement — runtime conecta como chat_nexus_app (NOBYPASSRLS).
      # Setar no painel Dokploy com a URL+senha do role (docs/RLS_OPERATIONS.md).
      # OBRIGATÓRIO em produção: validate_runtime_settings() faz fail-fast se
      # vazio (sem isso o app cai no superuser e o RLS fica inerte).
      DATABASE_URL_APP: ${DATABASE_URL_APP:-}
      LOG_JSON: "true"
      # A API não consome a fila: pool e limiter do LLM ficam no tamanho de
      # 1 slot mesmo que o .env compartilhado defina WORKER_CONCURRENCY.
      WORKER_CONCURRENCY: "1"
      # Object storage (mig 183/184) — vazio S3_BUCKET = storage desligado.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-chatnexus}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-troque-por-uma-senha-forte-no-dokploy}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      # Sprint U — avatares de usuário (upload local servido como estático)
      - avatars_data:/app/uploads/avatars
      # White-label — logos por empresa (servidas como estático)
      - logos_data:/app/uploads/logos
      # Disparador — mídia (foto) de campanha
      - disparador_media:/app/uploads/disparador

  worker:
    image: registry.vsanexus.com/chatnexus/worker:${IMAGE_TAG:-latest}
    pull_policy: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/whatsapp_langchain
      # RLS enforcement — ver nota no serviço `api`. Worker também roda como
      # chat_nexus_app e envolve cada mensagem em empresa_scope().
      DATABASE_URL_APP: ${DATABASE_URL_APP:-}
      LOG_JSON: "true"
      # Mensagens em voo por réplica, uma por conversa (claim serializado por
      # thread). 4 medido no dev em 18/09/2026: 89 msg/min por réplica, 4,1×
      # o serial, sem RAM extra. Sobrescrevível pelo env do Dokploy.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      # Object storage (mig 183/184) — mesmas envs do api.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-chatnexus}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-troque-por-uma-senha-forte-no-dokploy}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    depends_on:
      - db
    # `unless-stopped` é load-bearing: o worker se mata de propósito quando
    # acumula MAX_CONSECUTIVE_FAILURES (circuit breaker anti-zumbi em
    # worker/main.py). Sem restart automático ele fica morto de vez.
    restart: unless-stopped
    deploy:
      # 2 réplicas, não 4. Os 4 ficavam a 85% do teto de 512M cada e
      # empurravam a máquina (11GB) pro swap — foi o que degradou o host no
      # incidente 2026-07-26.
      #
      # Por que 2 e não 1: até 09/2026 o loop do worker era ESTRITAMENTE
      # SERIAL (claim de 1 mensagem → `await process_message` → repete), e
      # cada réplica processava uma mensagem por vez — 1 réplica ≈ 8,8 msg/min
      # (medido sobre 2727 mensagens reais: média 6,85s, p50 3,43s, p95
      # 15,73s), 2 réplicas ≈ 17,6, e o pico real chegou a 27 msg/min.
      # Hoje cada réplica leva WORKER_CONCURRENCY mensagens em voo (uma por
      # conversa — o claim é serializado por thread do LangGraph), então a
      # vazão vem de N × réplicas; ver docs/CUSTO_E_CAPACIDADE.md §4b pelo
      # número medido. Duas réplicas continuam valendo pra que um deploy ou
      # um crash não cale todo mundo.
      #
      # Quando mexer: medir antes de chutar —
      #   SELECT count(*), min(created_at) FROM message_queue
      #    WHERE status = 'queued';
      # Linhas esperando de forma sustentada = subir. O claim é serializado
      # POR CONVERSA (advisory lock + NOT EXISTS de row em processing com
      # lease válido), então escalar é seguro: réplicas não brigam pela
      # mesma mensagem nem rodam dois turnos no mesmo thread do LangGraph.
      # Pré-condição: LEASE_SECONDS curto (180) — com a trava, uma row
      # presa em processing após crash prende a conversa até o lease vencer.
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  frontend:
    # Build-time ARG INTERNAL_API_URL=http://api:8000 é aplicado no CI
    # (o rewrite /uploads/* congela a destination no route-manifest e tem
    # que bater com o runtime abaixo).
    image: registry.vsanexus.com/chatnexus/frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:8000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/whatsapp_langchain
      PORT: "3000"
    depends_on:
      - api
    restart: unless-stopped

  # Test Runner E2E (Sprint L) — container dedicado pra rodar a bateria via
  # UI em /relatorios/allure. Imagem da API permanece leve (Java/allure só
  # vivem nessa imagem).
  #
  # Atrás de `profiles` desde 2026-07-27: nada no fluxo de mensagem depende
  # dele (webhook, fila, worker, agente e envio funcionam sem), mas ocioso ele
  # segurava ~123MB e DUAS conexões permanentes no Postgres (`pool_min=2`)
  # pra uma feature usada esporadicamente.
  #
  # Pra usar:
  #   docker compose --profile qa up -d tests
  # E derrubar depois. A página /relatorios/allure fica indisponível enquanto
  # o container não estiver de pé.
  tests:
    profiles: ["qa"]
    image: registry.vsanexus.com/chatnexus/tests:${IMAGE_TAG:-latest}
    pull_policy: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/whatsapp_langchain
      LOG_JSON: "true"
      # API_BASE_URL: usado pelo conftest pra detectar API saudável + helpers
      # postam webhook. Dentro da rede Docker, api:8000 (não localhost:8081).
      API_BASE_URL: http://api:8000
      WEBHOOK_BASE_URL: http://api:8000
      # Workers baixam mídia do http server criado no container `tests`. Como
      # o tests roda na mesma rede Docker, hostname é `tests` (não localhost).
      MEDIA_SERVER_HOST: tests
      TEST_RUNNER_REPO_ROOT: /app
    expose:
      - "8001"
    volumes:
      - tests_reports:/app/tests/reports
    depends_on:
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Ocioso o runner fica em ~80MB; 1GB era teto pra bateria pesada e
          # reservava RAM que faltava pro resto do host. Se a suite completa
          # começar a ser morta por OOM, subir de novo.
          cpus: "0.5"
          memory: 512M

volumes:
  postgres_data:
  tests_reports:
  avatars_data:  # Sprint U — uploads de avatar (persiste em rebuilds)
  logos_data:  # White-label — logos por empresa (persiste em rebuilds)
  disparador_media:  # Disparador — fotos de campanha (persiste em rebuilds)
  minio_data:  # Object storage — mídia do cliente (mig 183/184); ENTRA NO BACKUP
