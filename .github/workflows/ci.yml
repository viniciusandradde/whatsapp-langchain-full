# Gate do Python — o par do `frontend.yml`.
#
# Até 2026-07-31 o único workflow que tocava o backend era o `deploy.yml`, e
# ele **não roda teste nenhum**: builda a imagem e manda o Dokploy recriar. Ou
# seja, o check verde do GitHub significava "a imagem compilou", não "o código
# está correto" — e como ele só dispara em push pra `master`, a informação
# chegava depois de já estar em produção.
#
# Este é o `make ci` (ruff + format + pyright + pytest com gate de cobertura),
# rodando em PR, que é onde dá pra agir antes do merge.
#
# Sem serviço de Postgres de propósito, e isso é load-bearing — não é só
# economia. O marcador `docker_demo` já separa o que precisa de banco, mas
# além disso a suíte **trava para sempre** quando há Postgres acessível:
# `test_post_webhook_aceita_payload_vazio_200` abre um pool preso ao event
# loop efêmero do TestClient e o portal do anyio nunca fecha. Sem banco,
# `get_pool()` estoura rápido e o teste passa. Adicionar um `services:
# postgres` aqui pendura o CI nos 20 minutos de timeout.
# Ver "A suíte não termina localmente" em docs/MIGRACAO_DEV.md.

name: ci

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Mesmo comando do `make setup`. `uv sync --locked` seria mais rápido,
      # mas quebra o CI quando o lock está atrasado — um motivo alheio ao
      # código que está sendo revisado.
      - name: Instalar dependências
        run: uv venv && uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run pyright src/

      # Mesmos marcadores do Makefile: `docker_demo` precisa do stack de pé e
      # `twilio_real` envia mensagem de verdade.
      - name: Testes
        run: uv run pytest -m "not docker_demo and not twilio_real" --cov --cov-fail-under=50
