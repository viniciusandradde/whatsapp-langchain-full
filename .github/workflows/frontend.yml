# Gate do frontend — o que faltava.
#
# Até 2026-07-30 nada validava `frontend/`: o Makefile só rodava Python e a
# única checagem era o `next build` dentro do docker build do deploy, em arm64
# emulado por QEMU e só depois do push pra master. Ou seja: erro de tipo ou de
# lint só aparecia no deploy.
#
# Aqui roda em amd64 nativo (rápido) e em PR, que é onde a informação serve.
# O passo de métricas é o que impede a dívida de UI de voltar durante a
# migração pra shadcn/ui (ADR-013 do plano de migração).

name: frontend

on:
  push:
    paths: ["frontend/**", "scripts/ui_metrics.sh", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "scripts/ui_metrics.sh", ".github/workflows/frontend.yml"]
  workflow_dispatch: {}

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        # Mesmo valor do build-arg do Dockerfile.frontend: o rewrite de
        # /uploads congela a destination em build time.
        env:
          INTERNAL_API_URL: http://api:8000
        run: npm run build

      - name: Métricas de UI (nenhuma pode subir)
        run: bash scripts/ui_metrics.sh --check
