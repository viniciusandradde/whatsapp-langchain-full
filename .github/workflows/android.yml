# Build do APK do app de atendimento (android/).
#
# Por que o build é aqui e não na máquina de dev: ela é aarch64, e o `aapt2`
# — obrigatório pelo Android Gradle Plugin — não tem build para Linux ARM64
# (o artefato `aapt2-<versão>-linux-arm64.jar` não existe no maven do Google,
# retorna 404). Somado a isso, a mesma máquina roda a produção com pouca RAM
# livre. Então o CI é o ÚNICO lugar onde este app compila.
#
# Consequência prática: todo erro de compilação aparece aqui, não no editor.
# Por isso o app é construído em fatias pequenas — falha isolada é diagnóstico,
# falha em cinquenta arquivos é caça a agulha.
#
# Assinatura de RELEASE via secrets, divergindo do launcher-vsa que assina em
# debug: no CI o `~/.android/debug.keystore` é regenerado a cada run, então a
# chave muda entre builds e o Android recusa atualizar por cima ("assinaturas
# divergentes"). Cada update exigiria desinstalar, perdendo sessão de login e
# cache local. Com chave estável, update instala por cima.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   — keystore .jks em base64
#   ANDROID_KEYSTORE_PASSWORD — senha do keystore
#   ANDROID_KEY_PASSWORD      — senha da chave
#
# O ALIAS não é secret (está fixo em app/build.gradle.kts): como segredo, o
# GitHub censurava o valor em todo log, e "nexus" aparece dentro do nome do
# pacote — cada linha virava `com.vsa***/atendimento`, ilegível pra debug.

name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

# `contents: write` é o que permite criar/atualizar o Release com o APK.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Garantir permissão do gradlew
        run: chmod +x ./gradlew

      - name: Restaurar keystore de release
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ausente — sem ele o APK sairia"
            echo "::error::assinado com chave efêmera e não atualizaria por cima."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "keystore restaurado: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"

      # Lint e testes unitários ANTES do assemble: falham mais rápido e com
      # mensagem melhor que um erro de empacotamento.
      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build do APK de release (assinado)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Confirmar que o APK está assinado com a chave de release
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK não gerado em $APK"; exit 1; }
          # apksigner vem no build-tools; o SHA-256 do certificado precisa ser
          # estável entre builds, senão o update por cima falha no aparelho.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" || true

      - name: Publicar o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-atendimento-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Release de tag fixa, recriada a cada build: o link de download continua
      # o mesmo, então dá pra salvar no celular e reusar. Só no master pra que
      # branch de trabalho não sobrescreva o APK que alguém está usando.
      - name: Publicar no Release (link direto de download)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk \
            app/build/outputs/apk/release/app-release.apk \
            --title "Nexus Atendimento — APK (última build)" \
            --notes "APK assinado gerado do commit ${{ github.sha }}.

          Para instalar: baixe o \`app-release.apk\` abaixo e abra no celular.
          Na primeira vez o Android vai pedir permissão para instalar de fonte
          desconhecida — é esperado, o app não está na Play Store.

          Atualizações instalam por cima, sem perder login nem dados." \
            --target "${{ github.sha }}"
